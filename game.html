        #game {

            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.25;
            filter: brightness(0.7) saturate(0.5);
        }
        #ui {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px 28px 28px;
        }
        #speaker {
            font-size: 14px;
            color: #b8a090;
            border-bottom: 3px solid #3a2c24;
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: none;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);

        #text {

            font-size: 15px;

            min-height: 4em;

        #choices {

            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
        }
        .btn {
            background: rgba(30, 22, 18, 0.85);
            border: 2px solid #4a3a32;
            color: #d4c4b0;
            padding: 10px 18px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            flex: 1 1 40%;
            min-width: 140px;
            text-align: center;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
        }
        .btn:hover {
            background: #3a2c24;
            border-color: #b8a090;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.7);
        }
        #progress {
            height: 6px;
            background: #1a1410;
            position: relative;
            margin-top: 14px;
            border: 1px solid #2a1e18;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
        }
        #fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5a3a2a, #8a5a3a);
            transition: width 0.4s ease;
        }
        #version {
            position: absolute;
            bottom: 6px;
            right: 14px;
            font-size: 8px;
            color: #3a2a22;
            z-index: 3;
            opacity: 0.6;
        }
        #backBtn {
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 3;
            background: rgba(0,0,0,0.6);
            border: 1px solid #4a3a32;
            color: #b8a090;
            padding: 4px 12px;
            font-size: 9px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            border-radius: 3px;
            transition: 0.2s;
        }
        #backBtn:hover {
            background: #3a2c24;
            color: #f0e6d0;
        }
        .stats-box {
            background: #0f0a08;
            border: 2px solid #4a3a32;
            padding: 12px 16px;
            margin: 6px 0;
            font-size: 11px;
            line-height: 2;
            color: #b8a090;
            white-space: pre-line;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .restart-btn {
            background: #2a1e18;
            border-color: #b06040;
            color: #f0d8c8;
            flex: 1 1 100%;
        }
        .restart-btn:hover {
            background: #4a3228;
            border-color: #c07050;
        }
        @media (max-width: 700px) {
            #game { height: 90vh; padding: 10px; }
            #ui { padding: 16px; }
            #text { font-size: 12px; line-height: 1.6; }
            .btn { font-size: 10px; padding: 8px 12px; flex: 1 1 100%; min-width: 0; }
            #speaker { font-size: 11px; }
            #backBtn { top: 8px; right: 8px; font-size: 7px; padding: 3px 8px; }
            #version { font-size: 6px; }
        }
        @media (min-width: 1200px) {

            #text { font-size: 18px; }
            .btn { font-size: 14px; padding: 14px 24px; }
            #speaker { font-size: 16px; }
        }
    </style>
</head>

var currentScene = storyData.startScene;
var visited = new Set();
var isTyping = false;
var timer = null;
var fullText = '';
var stats = {};

function trackChoice(choiceText, nextId) {
    if (choiceText.indexOf("\u0414\u043e\u0432\u0435\u0440\u0438\u0442\u044c") !== -1) stats.trustDimon = "\u0414\u0430";
    if (choiceText.indexOf("\u041e\u0442\u0432\u0435\u0442\u0438\u0442\u044c \u0440\u0435\u0437\u043a\u043e") !== -1) stats.stoodUp = "\u0414\u0430";
    if (choiceText.indexOf("\u0417\u0430\u0441\u0442\u0443\u043f\u0438\u0442\u044c") !== -1) stats.stoodUp = "\u0414\u0430";
    if (nextId === "work_honest") stats.path = "\u0427\u0435\u0441\u0442\u043d\u044b\u0439 \u0442\u0440\u0443\u0434";
    if (nextId === "work_criminal") stats.path = "\u041a\u0440\u0438\u043c\u0438\u043d\u0430\u043b";
    if (nextId === "work_security") stats.path = "\u041e\u0445\u0440\u0430\u043d\u0430";
    if (choiceText.indexOf("\u041f\u043e\u0446\u0435\u043b\u043e\u0432\u0430\u0442\u044c") !== -1) stats.kissed = "\u0414\u0430";
    if (nextId === "ending_good_1" || nextId === "ending_good_2") stats.ending = "\u0425\u043e\u0440\u043e\u0448\u0430\u044f";
    if (nextId === "ending_mid_1" || nextId === "ending_mid_2") stats.ending = "\u0421\u0440\u0435\u0434\u043d\u044f\u044f";
    if (nextId === "final_choice_bad") stats.ending = "\u041f\u043b\u043e\u0445\u0430\u044f";
}

function render(sceneId) {
    var scene = storyData.scenes.find(function(s) { return s.id === sceneId; });
    if (!scene) {
        document.getElementById('text').innerHTML = '\u0421\u0446\u0435\u043d\u0430 \u043d\u0435 \u043d\u0430\u0439\u0434\u0435\u043d\u0430.';
        return;
    }
    visited.add(sceneId);
    localStorage.setItem('save', JSON.stringify({ scene: sceneId, visited: Array.from(visited), stats: stats }));

    if (scene.background) {
        document.getElementById('bg').style.backgroundImage = 'url(' + scene.background + ')';
    }

    var speaker = document.getElementById('speaker');
    if (scene.speaker) {
        speaker.textContent = scene.speaker;
        speaker.className = 'show';
    } else {
        speaker.className = '';
    }

    var textEl = document.getElementById('text');
    textEl.innerHTML = '';
    fullText = scene.text || '';
    isTyping = true;
    typeWriter(textEl, fullText, 0);

    var choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    if (scene.choices && scene.choices.length > 0) {
        scene.choices.forEach(function(choice) {
            var btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = choice.text;
            btn.onclick = function() {
                trackChoice(choice.text, choice.nextId);
                if (choice.nextId) {
                    render(choice.nextId);
                } else {
                    showEnd();
                }
            };
            choicesEl.appendChild(btn);
        });
    } else {
        showEnd();
    }

    var total = storyData.scenes.length;
    var progress = Math.min(100, Math.round((visited.size / total) * 100));
    document.getElementById('fill').style.width = progress + '%';

    textEl.onclick = function() {
        if (isTyping) {
            clearTimeout(timer);
            textEl.innerHTML = fullText;
            isTyping = false;
        }
    };
}

function typeWriter(element, text, index) {
    if (index < text.length) {
        element.innerHTML += text.charAt(index);
        timer = setTimeout(function() {
            typeWriter(element, text, index + 1);
        }, 20);
    } else {
        isTyping = false;
    }
}

function showEnd() {
    var textEl = document.getElementById('text');
    var statsText = '';
    statsText += '--- \u0421\u0422\u0410\u0422\u0418\u0421\u0422\u0418\u041a\u0410 \u0412\u042b\u0411\u041e\u0420\u041e\u0412 ---\n';
    statsText += '\u0414\u043e\u0432\u0435\u0440\u0438\u043b\u0441\u044f \u0414\u0438\u043c\u043e\u043d\u0443? ' + (stats.trustDimon || '\u041d\u0435\u0442') + '\n';
    statsText += '\u0417\u0430\u0441\u0442\u0443\u043f\u0430\u043b\u0441\u044f \u0437\u0430 \u0441\u043b\u0430\u0431\u044b\u0445? ' + (stats.stoodUp || '\u041d\u0435\u0442') + '\n';
    statsText += '\u041f\u0443\u0442\u044c \u0432 \u0436\u0438\u0437\u043d\u0438: ' + (stats.path || '\u041d\u0435 \u0432\u044b\u0431\u0440\u0430\u043d') + '\n';
    statsText += '\u041f\u043e\u0446\u0435\u043b\u043e\u0432\u0430\u043b \u041a\u0438\u0440\u0443? ' + (stats.kissed || '\u041d\u0435\u0442') + '\n';
    statsText += '\u0424\u0438\u043d\u0430\u043b\u044c\u043d\u0430\u044f \u043a\u043e\u043d\u0446\u043e\u0432\u043a\u0430: ' + (stats.ending || '\u041d\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043d\u043e') + '\n';
    statsText += '----------------------------------';
    textEl.innerHTML = '\uD83C\uDFC1 \u041a\u043e\u043d\u0435\u0446. \u0421\u043f\u0430\u0441\u0438\u0431\u043e \u0437\u0430 \u0438\u0433\u0440\u0443!\n\n' + statsText;

    var choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    var btn = document.createElement('button');
    btn.className = 'btn restart-btn';
    btn.textContent = '\uD83D\uDD04 \u041d\u0430\u0447\u0430\u0442\u044c \u0437\u0430\u043d\u043e\u0432\u043e';
    btn.onclick = resetGame;
    choicesEl.appendChild(btn);
    localStorage.removeItem('save');
}

function resetGame() {
    visited = new Set();
    stats = {};
    currentScene = storyData.startScene;
    render(currentScene);
}

// Загрузка сохранения
var saved = localStorage.getItem('save');
if (saved) {
    try {
        var data = JSON.parse(saved);
        currentScene = data.scene || storyData.startScene;
        visited = new Set(data.visited || []);
        stats = data.stats || {};
    } catch(e) {}
}
render(currentScene);

// Кнопка "Меню"
document.getElementById('backBtn').onclick = function() {
    window.location.href = 'index.html';
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Broken Promises</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div id="game">
    <div id="bg"></div>
    <div id="ui">
        <div id="item-image"><img id="item-img" src="" alt=""></div>
        <div id="speaker-wrapper">
            <img id="speaker-avatar" src="" alt="avatar">
            <div id="speaker-info">
                <div id="speaker"></div>
                <div id="text"></div>
            </div>
        </div>
        <div id="choices"></div>
        <div id="progress"><div id="fill"></div></div>
    </div>
    <div id="version">v2.8.0</div>
    <button id="backBtn">← Меню</button>

    <audio id="bgMusic" loop autoplay>
        <source src="music/postpunk.mp3" type="audio/mpeg">
    </audio>

    <div id="endingOverlay" class="modal-overlay hidden">
        <div class="modal-box ending-modal">
            <div class="modal-title ending-title">🏁 Конец</div>
            <div class="ending-text" id="endingText"></div>
            <div class="ending-stats-box" id="endingStatsBox" style="display:none;">
                <div class="ending-stats-title">📊 Статистика ваших выборов</div>
                <div class="ending-stats-content" id="endingStatsContent"></div>
            </div>
            <div class="ending-buttons">
                <button class="btn ending-btn" id="showStatsBtn">📊 Показать статистику</button>
                <button class="btn ending-btn restart-btn" id="endingRestartBtn">🔄 Начать заново</button>
                <button class="btn ending-btn" id="endingMenuBtn">🏠 В меню</button>
            </div>
        </div>
    </div>
</div>

<script src="js/save-system.js" charset="UTF-8"></script>
<script src="js/story.js" charset="UTF-8"></script>
<script src="js/chapters/ch1.js" charset="UTF-8"></script>
<script src="js/chapters/ch2.js" charset="UTF-8"></script>
<script src="js/chapters/ch3.js" charset="UTF-8"></script>
<script src="js/chapters/ch4.js" charset="UTF-8"></script>
<script src="js/chapters/ch5.js" charset="UTF-8"></script>
<script src="js/story-builder.js" charset="UTF-8"></script>
<script src="js/game.js" charset="UTF-8"></script>
</body>
</html>

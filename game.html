    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0d0a08; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Press Start 2P',monospace; padding:10px; }
        #game { width:700px; max-width:100%; height:500px; max-height:90vh; background:#1a1410; border:4px solid #3a2c24; position:relative; overflow:hidden; display:flex; flex-direction:column; }
        #bg { position:absolute; top:0; left:0; width:100%; height:100%; background-size:cover; background-position:center; opacity:0.3; }
        #ui { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:16px; }
        #speaker { font-size:11px; color:#b8a090; border-bottom:2px solid #3a2c24; padding-bottom:4px; margin-bottom:6px; display:none; }
        #speaker.show { display:block; }
        #text { flex:1; overflow-y:auto; color:#d4c4b0; font-size:12px; line-height:1.6; cursor:pointer; min-height:3em; padding-right:4px; }
        #choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
        .btn { background:#1e1612; border:2px solid #4a3a32; color:#d4c4b0; padding:6px 12px; font-family:'Press Start 2P',monospace; font-size:10px; cursor:pointer; flex:1 1 45%; text-align:center; }
        .btn:hover { background:#3a2c24; }
        #progress { height:4px; background:#1a1410; position:relative; margin-top:6px; }
        #fill { height:100%; width:0%; background:#7a4a3a; transition:width 0.3s; }
        #version { position:absolute; bottom:2px; right:8px; font-size:7px; color:#3a2a22; z-index:3; }
        #backBtn { position:absolute; top:6px; right:6px; z-index:3; background:rgba(0,0,0,0.6); border:1px solid #4a3a32; color:#b8a090; padding:3px 8px; font-size:7px; cursor:pointer; font-family:'Press Start 2P',monospace; border-radius:2px; }
        #backBtn:hover { background:#3a2c24; }
        @media (max-width:600px) {
            #game { height:90vh; }
            #text { font-size:10px; }
            .btn { font-size:8px; padding:4px 8px; flex:1 1 100%; }
            #speaker { font-size:9px; }
            #backBtn { top:4px; right:4px; padding:2px 6px; font-size:6px; }
        }
        /* Стили для статистики в конце */
        #stats-box { background:#0f0a08; border:2px solid #4a3a32; padding:10px; margin:4px 0; font-size:9px; line-height:1.8; color:#b8a090; white-space:pre-line; }
        .restart-btn { background:#2a1e18; border-color:#b06040; color:#f0d8c8; flex:1 1 100%; }
        .restart-btn:hover { background:#4a3228; }
    </style>
</head>

var currentScene = storyData.startScene;
var visited = new Set();
var isTyping = false;
var timer = null;
var fullText = '';
var stats = {};

// Сбор статистики
function trackChoice(choiceText, nextId) {
    if (choiceText.indexOf("Довериться") !== -1) stats.trustDimon = "Да";
    if (choiceText.indexOf("Ответить резко") !== -1) stats.stoodUp = "Да";
    if (choiceText.indexOf("Заступиться") !== -1) stats.stoodUp = "Да";
    if (nextId === "work_honest") stats.path = "Честный труд";
    if (nextId === "work_criminal") stats.path = "Криминал";
    if (nextId === "work_security") stats.path = "Охрана";
    if (choiceText.indexOf("Поцеловать") !== -1) stats.kissed = "Да";
    if (nextId === "ending_good_1" || nextId === "ending_good_2") stats.ending = "Хорошая";
    if (nextId === "ending_mid_1" || nextId === "ending_mid_2") stats.ending = "Средняя";
    if (nextId === "final_choice_bad") stats.ending = "Плохая";
}

function render(sceneId) {
    var scene = storyData.scenes.find(function(s) { return s.id === sceneId; });
    if (!scene) {
        document.getElementById('text').innerHTML = 'Сцена не найдена.';
        return;
    }
    visited.add(sceneId);
    localStorage.setItem('save', JSON.stringify({ scene: sceneId, visited: Array.from(visited), stats: stats }));

    if (scene.background) {
        document.getElementById('bg').style.backgroundImage = 'url(' + scene.background + ')';
    }

    var speaker = document.getElementById('speaker');
    if (scene.speaker) {
        speaker.textContent = scene.speaker;
        speaker.className = 'show';
    } else {
        speaker.className = '';
    }

    var textEl = document.getElementById('text');
    textEl.innerHTML = '';
    fullText = scene.text || '';
    isTyping = true;
    typeWriter(textEl, fullText, 0);

    var choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    if (scene.choices && scene.choices.length > 0) {
        scene.choices.forEach(function(choice) {
            var btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = choice.text;
            btn.onclick = function() {
                trackChoice(choice.text, choice.nextId);
                if (choice.nextId) {
                    render(choice.nextId);
                } else {
                    showEnd();
                }
            };
            choicesEl.appendChild(btn);
        });
    } else {
        showEnd();
    }

    var total = storyData.scenes.length;
    var progress = Math.min(100, Math.round((visited.size / total) * 100));
    document.getElementById('fill').style.width = progress + '%';

    textEl.onclick = function() {
        if (isTyping) {
            clearTimeout(timer);
            textEl.innerHTML = fullText;
            isTyping = false;
        }
    };
}

function typeWriter(element, text, index) {
    if (index < text.length) {
        element.innerHTML += text.charAt(index);
        timer = setTimeout(function() {
            typeWriter(element, text, index + 1);
        }, 20);
    } else {
        isTyping = false;
    }
}

function showEnd() {
    var textEl = document.getElementById('text');
    var statsText = '';
    statsText += '--- СТАТИСТИКА ВЫБОРОВ ---\n';
    statsText += 'Доверился Димону? ' + (stats.trustDimon || 'Нет') + '\n';
    statsText += 'Заступался за слабых? ' + (stats.stoodUp || 'Нет') + '\n';
    statsText += 'Путь в жизни: ' + (stats.path || 'Не выбран') + '\n';
    statsText += 'Поцеловал Киру? ' + (stats.kissed || 'Нет') + '\n';
    statsText += 'Финальная концовка: ' + (stats.ending || 'Неизвестно') + '\n';
    statsText += '----------------------------------';
    textEl.innerHTML = '🏁 Конец. Спасибо за игру!\n\n' + statsText;

    var choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    var btn = document.createElement('button');
    btn.className = 'btn restart-btn';
    btn.textContent = '🔄 Начать заново';
    btn.onclick = resetGame;
    choicesEl.appendChild(btn);
    localStorage.removeItem('save');
}

function resetGame() {
    visited = new Set();
    stats = {};
    currentScene = storyData.startScene;
    render(currentScene);
}

// Загрузка сохранения
var saved = localStorage.getItem('save');
if (saved) {
    try {
        var data = JSON.parse(saved);
        currentScene = data.scene || storyData.startScene;
        visited = new Set(data.visited || []);
        stats = data.stats || {};
    } catch(e) {}
}
render(currentScene);

// Кнопка "Меню" – возврат на главную
document.getElementById('backBtn').onclick = function() {
    window.location.href = 'index.html';
};
</script>
</body>
</html>

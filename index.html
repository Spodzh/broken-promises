<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Broken Promises</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
        }
        body {
            background: #0d0a08;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            padding: 10px;
        }
        #menu {
            width: 800px;
            max-width: 100%;
            height: 600px;
            max-height: 90vh;
            background: linear-gradient(145deg, #1a1410, #0f0a08);
            border: 6px solid #3a2c24;
            box-shadow: 0 0 0 4px #5a4a3a, 0 0 0 8px #2a1e18, inset 0 0 60px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 30px;
            overflow: hidden;
            animation: pixelFade 0.6s steps(2);
        }
        @keyframes pixelFade {
            0% { opacity: 0; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        #menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 3px, transparent 3px, transparent 6px);
            z-index: 0;
            pointer-events: none;
        }
        #title {
            font-size: 42px;
            color: #d4c4b0;
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(180,80,60,0.4);
            z-index: 1;
            text-align: center;
        }
        #subtitle {
            font-size: 14px;
            color: #7a6a5a;
            letter-spacing: 3px;
            margin-bottom: 40px;
            z-index: 1;
        }
        #buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 60%;
            max-width: 300px;
            z-index: 1;
        }
        .btn {
            background: #1e1612;
            border: 3px solid #4a3a32;
            color: #d4c4b0;
            padding: 14px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-shadow: inset 0 0 0 2px #0f0a08;
            transition: all 0.15s steps(2);
            touch-action: manipulation;
        }
        .btn:hover {
            background: #3a2c24;
            color: #f0e6d0;
            border-color: #b8a090;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn.play {
            border-color: #b06040;
            background: #2a1e18;
            color: #f0d8c8;
        }
        .btn.play:hover {
            background: #4a3228;
            border-color: #c07050;
        }
        #version {
            position: absolute;
            bottom: 10px;
            right: 16px;
            font-size: 8px;
            color: #3a2a22;
            z-index: 1;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 1px;
            opacity: 0.5;
        }
        #warning {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px;
            animation: pixelFade 0.4s steps(2);
        }
        #warning.hidden {
            display: none;
        }
        #wtitle {
            font-size: 18px;
            color: #f0d8c8;
            margin-bottom: 16px;
            letter-spacing: 2px;
            border-bottom: 3px solid #3a2c24;
            padding-bottom: 8px;
        }
        #wtext {
            font-size: 11px;
            color: #d4c4b0;
            text-align: center;
            line-height: 2;
            max-width: 450px;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        #wbtn {
            background: #2a1e18;
            border: 3px solid #b06040;
            color: #f0d8c8;
            padding: 12px 24px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            box-shadow: inset 0 0 0 2px #0f0a08;
            transition: all 0.15s steps(2);
        }
        #wbtn:hover {
            background: #4a3228;
            border-color: #c07050;
        }

        @media (max-width: 700px) {
            #menu {
                height: 90vh;
                padding: 20px;
                border-width: 4px;
                box-shadow: 0 0 0 2px #5a4a3a, 0 0 0 4px #2a1e18;
            }
            #title {
                font-size: 24px;
                letter-spacing: 4px;
            }
            #subtitle {
                font-size: 10px;
                margin-bottom: 30px;
                letter-spacing: 2px;
            }
            .btn {
                font-size: 11px;
                padding: 12px;
            }
            #buttons {
                width: 80%;
            }
            #wtitle {
                font-size: 14px;
            }
            #wtext {
                font-size: 9px;
            }
            #wbtn {
                font-size: 10px;
                padding: 10px 16px;
            }
            #version {
                font-size: 6px;
                bottom: 6px;
                right: 10px;
            }
        }
        @media (max-width: 400px) {
            #title {
                font-size: 18px;
            }
            .btn {
                font-size: 9px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div id="menu">
    <div id="title">BROKEN PROMISES</div>
    <div id="subtitle">История одной жизни</div>
    <div id="buttons">
        <button class="btn play" id="playBtn">▶ Играть</button>
        <button class="btn" id="settingsBtn">⚙ Настройки</button>
        <button class="btn" id="supportBtn">✉ Поддержать</button>
    </div>
    <div id="version">v2.0.0</div>
    <div id="warning">
        <div id="wtitle">⚠ ВНИМАНИЕ</div>
        <div id="wtext">
            Игра находится на ранней стадии разработки.
            Возможны баги, изменения сюжета и дизайна.

            Поддержать и следить за новостями можно в телеграм-канале:
            t.me/brokenpromisesgame
        </div>
        <button id="wbtn">Я понял, продолжить</button>
    </div>
</div>
<script>
    document.getElementById('playBtn').onclick = function() {
        window.location.href = 'game.html';
    };
    document.getElementById('settingsBtn').onclick = function() {
        alert('⚙ Настройки в разработке\nСкоро здесь появятся регулировка звука и языка.');
    };
    document.getElementById('supportBtn').onclick = function() {
        window.open('https://t.me/brokenpromisesgame', '_blank');
    };
    document.getElementById('wbtn').onclick = function() {
        document.getElementById('warning').classList.add('hidden');
    };
</script>
</body>
</html>

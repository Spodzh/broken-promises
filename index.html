    <style>

        .btn { background:#1e1612; border:2px solid #4a3a32; color:#d4c4b0; padding:8px 16px; font-family:'Press Start 2P',monospace; font-size:12px; cursor:pointer; flex:1 1 45%; text-align:center; transition:0.2s; }

        #version { position:absolute; bottom:4px; right:12px; font-size:8px; color:#3a2a22; z-index:3; }
        .menu-btn { background:#1e1612; border:2px solid #4a3a32; color:#d4c4b0; padding:10px; font-family:'Press Start 2P',monospace; font-size:12px; cursor:pointer; text-align:center; transition:0.2s; margin:4px 0; }
        .menu-btn:hover { background:#3a2c24; border-color:#b8a090; }
        .menu-btn.play { border-color:#b06040; }
        #menu-screen { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; padding:20px; }
        #menu-screen h1 { font-size:36px; color:#d4c4b0; letter-spacing:6px; margin-bottom:12px; text-shadow:0 0 20px rgba(180,80,60,0.3); }
        #menu-screen h2 { font-size:14px; color:#7a6a5a; margin-bottom:40px; letter-spacing:2px; }
        #menu-buttons { width:60%; max-width:300px; }
        .restart-btn { background:#2a1e18; border-color:#b06040; color:#f0d8c8; flex:1 1 100%; }
        .restart-btn:hover { background:#4a3228; }
        .stats-box { background:#0f0a08; border:2px solid #4a3a32; padding:12px; margin:6px 0; font-size:10px; line-height:2; color:#b8a090; white-space:pre-line; }
        #warning { display:flex; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); justify-content:center; align-items:center; flex-direction:column; padding:20px; z-index:10; }
        #warning.hidden { display:none; }
        #wtitle { font-size:18px; color:#f0d8c8; margin-bottom:16px; letter-spacing:2px; }
        #wtext { font-size:11px; color:#d4c4b0; text-align:center; line-height:2; max-width:450px; margin-bottom:20px; white-space:pre-line; }
        #wbtn { background:#2a1e18; border:2px solid #b06040; color:#f0d8c8; padding:12px 24px; font-family:'Press Start 2P',monospace; font-size:12px; cursor:pointer; transition:0.2s; }

        #backBtn:hover { background:#3a2c24; }
        @media (max-width:600px) {

            #text { font-size:12px; }

//  ДВИЖОК
// ============================================================
var currentScene = storyData.startScene;
var visited = new Set();
var isTyping = false;
var timer = null;
var fullText = '';
var stats = {};

// Элементы
var bg = document.getElementById('bg');
var speaker = document.getElementById('speaker');
var textEl = document.getElementById('text');
var choicesEl = document.getElementById('choices');
var fill = document.getElementById('fill');
var backBtn = document.getElementById('backBtn');
var warning = document.getElementById('warning');
var wbtn = document.getElementById('wbtn');
var version = document.getElementById('version');

// Показать предупреждение
wbtn.onclick = function() { warning.classList.add('hidden'); };

function trackChoice(choiceText, nextId) {
    if (choiceText.indexOf("Довериться") !== -1) stats.trustDimon = "Да";
    if (choiceText.indexOf("Ответить резко") !== -1) stats.stoodUp = "Да";
    if (choiceText.indexOf("Заступиться") !== -1) stats.stoodUp = "Да";
    if (nextId === "work_honest") stats.path = "Честный труд";
    if (nextId === "work_criminal") stats.path = "Криминал";
    if (nextId === "work_security") stats.path = "Охрана";
    if (choiceText.indexOf("Поцеловать") !== -1) stats.kissed = "Да";
    if (nextId === "ending_good_1" || nextId === "ending_good_2") stats.ending = "Хорошая";
    if (nextId === "ending_mid_1" || nextId === "ending_mid_2") stats.ending = "Средняя";
    if (nextId === "final_choice_bad") stats.ending = "Плохая";
}

function render(sceneId) {
    var scene = storyData.scenes.find(function(s) { return s.id === sceneId; });
    if (!scene) {
        textEl.innerHTML = 'Сцена не найдена.';
        return;
    }
    visited.add(sceneId);
    localStorage.setItem('save', JSON.stringify({ scene: sceneId, visited: Array.from(visited), stats: stats }));

    if (scene.background) {
        bg.style.backgroundImage = 'url(' + scene.background + ')';
    }

    if (scene.speaker) {
        speaker.textContent = scene.speaker;
        speaker.className = 'show';
    } else {
        speaker.className = '';
    }

    textEl.innerHTML = '';
    fullText = scene.text || '';
    isTyping = true;
    typeWriter(textEl, fullText, 0);

    choicesEl.innerHTML = '';
    if (scene.choices && scene.choices.length > 0) {
        scene.choices.forEach(function(choice) {
            var btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = choice.text;
            btn.onclick = function() {
                trackChoice(choice.text, choice.nextId);
                if (choice.nextId) {
                    render(choice.nextId);
                } else {
                    showEnd();
                }
            };
            choicesEl.appendChild(btn);
        });
    } else {
        showEnd();
    }

    var total = storyData.scenes.length;
    var progress = Math.min(100, Math.round((visited.size / total) * 100));
    fill.style.width = progress + '%';

    textEl.onclick = function() {
        if (isTyping) {
            clearTimeout(timer);
            textEl.innerHTML = fullText;
            isTyping = false;
        }
    };
}

function typeWriter(element, text, index) {
    if (index < text.length) {
        element.innerHTML += text.charAt(index);
        timer = setTimeout(function() {
            typeWriter(element, text, index + 1);
        }, 20);
    } else {
        isTyping = false;
    }
}

function showEnd() {
    var statsText = '';
    statsText += '--- СТАТИСТИКА ВЫБОРОВ ---\n';
    statsText += 'Доверился Димону? ' + (stats.trustDimon || 'Нет') + '\n';
    statsText += 'Заступался за слабых? ' + (stats.stoodUp || 'Нет') + '\n';
    statsText += 'Путь в жизни: ' + (stats.path || 'Не выбран') + '\n';
    statsText += 'Поцеловал Киру? ' + (stats.kissed || 'Нет') + '\n';
    statsText += 'Финальная концовка: ' + (stats.ending || 'Неизвестно') + '\n';
    statsText += '----------------------------------';
    textEl.innerHTML = '🏁 Конец. Спасибо за игру!\n\n' + statsText;

    choicesEl.innerHTML = '';
    var btn = document.createElement('button');
    btn.className = 'btn restart-btn';
    btn.textContent = '🔄 Начать заново';
    btn.onclick = resetGame;
    choicesEl.appendChild(btn);
    localStorage.removeItem('save');
}

function resetGame() {
    visited = new Set();
    stats = {};
    currentScene = storyData.startScene;
    render(currentScene);
}

// Загрузка сохранения
var saved = localStorage.getItem('save');
if (saved) {
    try {
        var data = JSON.parse(saved);
        currentScene = data.scene || storyData.startScene;
        visited = new Set(data.visited || []);
        stats = data.stats || {};
    } catch(e) {}
}

    // Просто начинаем игру с первой сцены

    // Но мы можем сделать кнопку "Меню" для возврата в начало
    // Я реализую: при нажатии "Меню" перезапускаем игру с первой сцены
}

backBtn.onclick = function() {
    if (confirm('Вернуться в главное меню? Прогресс будет потерян.')) {
        localStorage.removeItem('save');
        visited = new Set();
        stats = {};
        currentScene = storyData.startScene;
        render(currentScene);
    }
};

// Старт
render(currentScene);
